server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance   ENABLE GZIP COMPRESSION FOR STATIC ASSETS 
    gzip on;    
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback — all routes serve      try_files $uri $uri/ /index.html;    

    # Cache static assets  
        expires 1y;
        add_header Cache-Control "public, immutable";    

    # Security headers (optional but recommended)   ADD SECURITY HEADERS 
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
