services:
  # ============================================
  # OnlyOffice Document Server
  # ============================================
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: patent-writer-onlyoffice
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_PORT:-8080}:80"
    environment:
      POSTGRES_DB: onlyoffice
      POSTGRES_USER: onlyoffice
      POSTGRES_PASSWORD: onlyoffice
      JWT_SECRET: ${ONLYOFFICE_SECRET:-}
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    networks:
      - patent-writer-net
    healthcheck:
      disable: true

  # ============================================
  # 后端服务 — FastAPI
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: patent-writer-backend
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      DIFY_BASE_URL: ${DIFY_BASE_URL}
      DIFY_API_KEY: ${DIFY_API_KEY}
      ONLYOFFICE_DOC_SERVER_URL: ${ONLYOFFICE_DOC_SERVER_URL}
      ONLYOFFICE_SECRET: ${ONLYOFFICE_SECRET}
      ONLYOFFICE_CALLBACK_URL: ${ONLYOFFICE_CALLBACK_URL}

    healthcheck:
      disable: true

    volumes:
      - ${UPLOAD_DIR_HOST:-./data/uploads}:/app/uploads

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - patent-writer-net

    depends_on:
      onlyoffice:




  # ============================================
  # 前端服务 — React + Vite (生产模式 serve)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: patent-writer-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    healthcheck:
      disable: true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - patent-writer-net

    depends_on:
      - backend



# ============================================
# 网络
# ============================================
networks:
  patent-writer-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16



# ============================================
# 卷（OnlyOffice 持久化数据）
# ============================================
volumes:
  onlyoffice-data:
  onlyoffice-logs:
